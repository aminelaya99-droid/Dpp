name: بناء DPP لـ Windows

# كل push: اختبارات + فحص ذاتي + بناء DPP.exe (يُحمَّل من صفحة الـ Actions، Artifact باسم DPP-windows)
# وسم يبدأ بـ v (مثل v1.8.0): نفس الشيء + Release فيه DPP-windows.zip جاهز للتحميل
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  # المحرك الداخلي يُبنى لكل معالجات AVX2 (لا لمعالج جهاز البناء)، وبلا OpenMP (لا يحتاج vcomp140.dll)
  CMAKE_ARGS: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_AVX512=OFF -DGGML_OPENMP=OFF
  # نموذج صغير جداً لاختبار أن المحرك يعمل من البرنامج المبني (لا لتقييم الجودة)
  TINY_GGUF: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ai.txt

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: تثبيت المحرك الداخلي (llama.cpp)
        run: pip install -r requirements-ai.txt

      - name: الاختبارات
        continue-on-error: true          # الفشل يظهر في السجل لكن لا يمنع بناء exe
        run: python -m pytest -q tests

      - name: الفحص الذاتي
        env:
          DPP_DATA_DIR: ${{ runner.temp }}\dpp-selftest
          DPP_SELFTEST_AI: "1"
        run: python run_dpp.py --selftest

      - name: بناء exe
        run: pyinstaller --noconfirm dpp.spec

      - name: فحص ملفات OR-Tools والمحرك الداخلي داخل البرنامج
        run: |
          foreach ($f in "ortools.dll","abseil_dll.dll","libprotobuf.dll") {
            if (-not (Test-Path "dist\DPP\_internal\ortools\.libs\$f")) { throw "ناقص: _internal\ortools\.libs\$f" }
          }
          Get-ChildItem dist\DPP\_internal\ortools\.libs | Format-Table Name, Length
          Get-ChildItem -Recurse dist\DPP\_internal\llama_cpp -Include *.dll | Format-Table FullName, Length
          if (-not (Get-ChildItem -Recurse dist\DPP\_internal\llama_cpp -Include llama.dll)) { throw "ناقص: llama.dll" }

      - name: فحص ذاتي من exe
        timeout-minutes: 6          # exe معلّق لا يجب أن يوقف البناء ساعات
        env:
          DPP_DATA_DIR: ${{ runner.temp }}\dpp-selftest-exe
          DPP_SELFTEST_AI: "1"
        run: |
          $p = Start-Process -FilePath dist\DPP\DPP.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-ChildItem -Path $env:TEMP -Filter "selftest_report.txt" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1 | Get-Content -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }

      - name: رفع البرنامج
        if: always()                # الملف التنفيذي يُرفع حتى لو فشل الفحص، ليُجرَّب يدوياً
        uses: actions/upload-artifact@v4
        with:
          name: DPP-windows
          path: dist/DPP
          retention-days: 30
          include-hidden-files: true   # ضروري: OR-Tools يضع ملفاته في مجلد ".libs" (يبدأ بنقطة) وكان يُحذف من الملف المرفوع

      - name: ضغط للإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        run: 7z a -tzip DPP-windows.zip .\dist\DPP

      - name: إصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DPP-windows.zip

  # يحمّل الملف المرفوع نفسه (ما يحمّله المستخدم) على جهاز نظيف ويشغّل الفحص الذاتي منه، مع نموذج حقيقي صغير
  verify:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DPP-windows
          path: DPP
      - name: الملف المرفوع فيه OR-Tools
        run: |
          if (-not (Test-Path "DPP\_internal\ortools\.libs\ortools.dll")) { throw "الملف المرفوع بلا _internal\ortools\.libs" }
      - name: تحميل نموذج صغير للتجربة
        run: curl.exe -L --fail -o tiny.gguf $env:TINY_GGUF
      - name: فحص ذاتي من الملف المرفوع (مع المساعد الذكي)
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
          DPP_DATA_DIR: ${{ runner.temp }}\dpp-verify
        run: |
          $env:DPP_SELFTEST_GGUF = (Resolve-Path tiny.gguf).Path
          $p = Start-Process -FilePath DPP\DPP.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-ChildItem -Path $env:TEMP -Filter "selftest_report.txt" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1 | Get-Content -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }

  # تجربة المساعد بالنموذج الموصى به (4B) على أسئلة حقيقية؛ السجل يُقرأ لتقييم الجودة ولا يمنع الإصدار
  ai-eval:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ai.txt
      - name: تثبيت
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ai.txt
      - name: روابط النماذج الموصى بها (هل هي موجودة؟)
        shell: bash
        run: |
          for u in \
            https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf \
            https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf \
            https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf \
            https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf ; do
            code=$(curl -s -o /dev/null -I -L -w "%{http_code} %{size_download}" "$u"); echo "$code $u"
          done
      - name: تحميل النموذج الموصى به
        shell: bash
        run: |
          curl -L --fail -o model.gguf https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf \
          || curl -L --fail -o model.gguf https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf
          ls -la model.gguf
      - name: أسئلة حقيقية للمساعد
        run: python scripts/ai_eval.py model.gguf

  # النسخة الخفيفة لويندوز 7 (32 بت): Python 3.8 + PySide2 (Qt 5)، بلا OR-Tools
  lite:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x86"

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt pyinstaller==5.13.2

      - name: الفحص الذاتي
        env:
          DPP_DATA_DIR: ${{ runner.temp }}\dpp-lite-selftest
        run: python run_dpp_lite.py --selftest

      - name: بناء exe
        run: pyinstaller --noconfirm dpp_lite.spec

      - name: فحص ذاتي من exe
        timeout-minutes: 6
        env:
          DPP_DATA_DIR: ${{ runner.temp }}\dpp-lite-exe
        run: |
          $p = Start-Process -FilePath dist\DPP-Lite\DPP-Lite.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "lite selftest failed: $($p.ExitCode)" }

      - name: رفع النسخة الخفيفة
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DPP-Lite-win7-x86
          path: dist/DPP-Lite
          include-hidden-files: true
          retention-days: 30
