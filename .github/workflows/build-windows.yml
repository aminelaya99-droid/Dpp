name: بناء DPP لـ Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت المتطلبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: الاختبارات
        env:
          QT_QPA_PLATFORM: offscreen
        # النتيجة تُقرأ من تقرير JUnit: Qt قد ينهار أثناء إغلاق العملية في وضع offscreen
        # على Windows بعد نجاح كل الاختبارات، فلا نعتمد على رمز الخروج وحده.
        run: |
          python -m pytest -q --junitxml=test-results.xml
          Write-Host "pytest exit code: $LASTEXITCODE"
          python ci/check_junit.py test-results.xml

      - name: اختبار الإقلاع
        env:
          QT_QPA_PLATFORM: offscreen
          DPP_DATA_DIR: ${{ runner.temp }}\dpp-smoke
        run: |
          $out = (python -m dpp --smoke 2>&1 | Out-String)
          Write-Host $out
          if ($out -notmatch "SMOKE-OK") { exit 1 }
          exit 0

      - name: بناء exe
        run: pyinstaller --noconfirm dpp.spec

      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: DPP-windows
          path: dist/DPP
          retention-days: 30

      - name: ضغط للإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path dist/DPP -DestinationPath DPP-windows.zip

      - name: إصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DPP-windows.zip
